<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Diamanage — Doctor Login</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/auth.css" />
  <style>
    /* Auth page layout */
    .auth-wrapper {
      min-height: calc(100vh - 65px);
      display: grid;
      place-items: center;
      padding: 32px 18px;
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
      background: rgba(255,255,255,0.80);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 32px 28px;
    }

    /* Teal accent strip along the top */
    .auth-card::before {
      content: '';
      display: block;
      height: 4px;
      margin: -32px -28px 28px;
      border-radius: var(--radius) var(--radius) 0 0;
      background: linear-gradient(90deg, var(--teal), var(--blue));
    }

    .auth-logo {
      display: flex;
      justify-content: center;
      margin-bottom: 18px;
    }

    .auth-logo img { height: 44px; width: auto; }

    .role-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 18px;
    }

    .role-badge span {
      display: inline-block;
      padding: 5px 14px;
      border-radius: 999px;
      background: rgba(10,166,166,0.10);
      border: 1px solid rgba(10,166,166,0.28);
      color: var(--teal);
      font-weight: 800;
      font-size: 0.88rem;
    }

    .auth-card h1 {
      margin: 0 0 6px;
      font-size: 1.55rem;
      text-align: center;
    }

    .auth-card .auth-sub {
      margin: 0 0 26px;
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .auth-field {
      margin-bottom: 16px;
    }

    .auth-field label {
      display: block;
      font-weight: 700;
      font-size: 0.88rem;
      margin-bottom: 6px;
    }

    .auth-field input {
      width: 100%;
      padding: 11px 14px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.95);
      font-size: 0.97rem;
      outline: none;
      transition: border-color 0.15s;
    }

    .auth-field input:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(10,166,166,0.12);
    }

    .auth-btn {
      width: 100%;
      margin-top: 8px;
      padding: 13px;
      border-radius: 14px;
      border: none;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      color: white;
      background: linear-gradient(135deg, var(--teal), var(--blue));
      box-shadow: 0 10px 25px rgba(10,166,166,0.20);
      transition: filter 0.15s;
    }

    .auth-btn:hover { filter: brightness(1.04); }
    .auth-btn:disabled { opacity: 0.6; cursor: not-allowed; filter: none; }

    .auth-msg {
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      display: none;
    }

    .auth-msg.error {
      background: rgba(220,38,38,0.08);
      border: 1px solid rgba(220,38,38,0.20);
      color: #dc2626;
    }

    .auth-msg.success {
      background: rgba(10,166,166,0.08);
      border: 1px solid rgba(10,166,166,0.22);
      color: var(--teal);
    }

    .auth-links {
      margin-top: 22px;
      text-align: center;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .auth-links a {
      color: var(--blue);
      font-weight: 700;
    }

    .auth-divider {
      margin: 18px 0;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .patient-link-btn {
      width: 100%;
      padding: 11px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(31,127,191,0.07);
      color: var(--blue);
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      text-align: center;
      display: block;
      transition: background 0.15s;
      text-decoration: none;
    }

    .patient-link-btn:hover {
      background: rgba(31,127,191,0.13);
      text-decoration: none;
    }
  </style>
</head>

<body>
  <!-- Header -->
  <header class="header">
    <a class="brand" href="index.html" aria-label="Diamanage home">
      <img src="../assets/logo.png" alt="Diamanage logo" class="brand-logo" />
    </a>
    <nav class="nav" aria-label="Primary">
      <button class="hamburger" id="hamburger" aria-label="Open menu" aria-expanded="false" aria-controls="navMenu">
        <span></span><span></span><span></span>
      </button>
      <div class="nav-menu" id="navMenu">
        <a href="index.html" class="nav-link">Home</a>
        <a href="#" class="nav-link">About</a>
        <a href="login.html" class="nav-link">Log in</a>
        <a href="register.html" class="nav-link nav-cta">Sign up</a>
      </div>
    </nav>
  </header>

  <!-- Auth -->
  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-logo">
        <img src="../assets/logo.png" alt="Diamanage" />
      </div>

      <div class="role-badge"><span>🩺 Clinician Portal</span></div>

      <h1>Doctor sign-in</h1>
      <p class="auth-sub">Access your patient dashboard</p>

      <form id="doctorLoginForm" novalidate>
        <div class="auth-field">
          <label for="email">Email address</label>
          <input id="email" type="email" placeholder="doctor@clinic.com" autocomplete="email" required />
        </div>

        <div class="auth-field">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" required />
        </div>

        <button class="auth-btn" type="submit" id="submitBtn">Sign in to dashboard</button>

        <div class="auth-msg" id="authMsg"></div>
      </form>

      <div class="auth-divider">or</div>

      <a class="patient-link-btn" href="login.html">👤 Patient? Log in here</a>

      <div class="auth-links">
        Not a registered clinician? <a href="register.html">Create account</a>
      </div>
    </div>
  </main>

  <script>
    // Hamburger
    document.getElementById('hamburger').addEventListener('click', function () {
      const menu = document.getElementById('navMenu');
      const expanded = this.getAttribute('aria-expanded') === 'true';
      this.setAttribute('aria-expanded', String(!expanded));
      menu.classList.toggle('open');
    });

    // Doctor login form
    const form      = document.getElementById('doctorLoginForm');
    const msgEl     = document.getElementById('authMsg');
    const submitBtn = document.getElementById('submitBtn');

    function showMsg(text, type) {
      msgEl.textContent = text;
      msgEl.className   = 'auth-msg ' + type;
      msgEl.style.display = 'block';
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      msgEl.style.display = 'none';

      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showMsg('Please fill in all fields.', 'error');
        return;
      }

      submitBtn.disabled    = true;
      submitBtn.textContent = 'Signing in…';

      try {
        const res  = await fetch('https://diamanage.onrender.com/api/user/login', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (data.success) {
          if (data.role !== 'DOCTOR') {
            showMsg('This portal is for doctors only. Please use the patient login.', 'error');
            submitBtn.disabled    = false;
            submitBtn.textContent = 'Sign in to dashboard';
            return;
          }

          // Persist basic session info
          sessionStorage.setItem('userId',   data.userId);
          sessionStorage.setItem('userName', data.name);
          sessionStorage.setItem('userRole', data.role);

          showMsg('Welcome back, Dr. ' + data.name + '! Redirecting…', 'success');
          setTimeout(() => { window.location.href = 'doctor_dashboard.html'; }, 1000);
        } else {
          showMsg(data.message || 'Invalid email or password.', 'error');
          submitBtn.disabled    = false;
          submitBtn.textContent = 'Sign in to dashboard';
        }
      } catch (err) {
        showMsg('Could not reach the server. Please try again.', 'error');
        submitBtn.disabled    = false;
        submitBtn.textContent = 'Sign in to dashboard';
      }
    });
  </script>
</body>
</html>
